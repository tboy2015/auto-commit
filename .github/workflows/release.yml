name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Sign & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(grep '^pluginVersion=' gradle.properties | cut -d= -f2)
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag ($TAG) does not match pluginVersion ($VERSION)"; exit 1
          fi

      # NOTE: verifyPlugin 需要下载对应版本的 IC，2026.1.x IC 暂未发布。
      # 暂时跳过；Marketplace 上架时会做兼容性扫描。
      # - name: Plugin verifier
      #   run: ./gradlew -PlocalIdePath= -PplatformVersion=2024.3.5 -PplatformType=IC verifyPlugin

      - name: Sign & publish
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: ./gradlew -PlocalIdePath= -PplatformVersion=2026.1.2 -PplatformType=IC publishPlugin

      - name: Upload signed distribution
        uses: actions/upload-artifact@v4
        with:
          name: signed-plugin
          path: build/distributions/*-signed.zip
          if-no-files-found: warn

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/distributions/*.zip
