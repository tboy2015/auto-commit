name: Build & Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build & test
        # CI 没有本地 IDEA 路径，临时覆盖 platformVersion 走下载方式
        run: |
          ./gradlew \
            -PlocalIdePath= \
            -PplatformVersion=2026.1.2 \
            -PplatformType=IC \
            test buildPlugin

      - name: Plugin verifier
        run: ./gradlew -PlocalIdePath= -PplatformVersion=2026.1.2 -PplatformType=IC verifyPlugin

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: plugin-zip
          path: build/distributions/*.zip
          if-no-files-found: error
